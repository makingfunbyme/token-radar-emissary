<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Token Radar // Emissary</title>
  <link rel="stylesheet" href="../dashboard/app.css">
  <script src="../data.js" defer></script>
  <script src="../dashboard/app.js" defer></script>
</head>
<body>
  <header class="command">
    <div class="masthead">
      <div class="brand"><div class="radar-mark" aria-hidden="true"><i></i></div><div><div class="wordmark">TOKEN RADAR <span>//</span> EMISSARY</div><div class="micro">Token launch intelligence</div></div></div>
      <div class="snapshot"><span class="micro">Snapshot</span><time id="date"></time><small id="source"></small></div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="ticker"><div class="ticker-label"><span></span> Market context</div><div id="ticker" class="ticker-items"></div></div>
  </header>
  <div class="workspace">
    <aside class="rail" aria-label="Board filters">
      <div class="rail-head"><h2>Filters</h2><button type="button" id="reset" class="quiet">Reset</button></div>
      <form id="filters">
        <label class="micro" for="search">Find a protocol</label>
        <input id="search" name="search" type="search" placeholder="Name or category" autocomplete="off">
        <label class="toggle"><input name="watch" type="checkbox"> Watchlist only</label>
        <fieldset><legend>Category</legend><div id="categories" class="options"></div></fieldset>
        <fieldset><legend>Chain</legend><div id="chains" class="options"></div></fieldset>
        <div class="select-stack">
          <label class="micro">Confidence<select name="confidence"><option value="">Any confidence</option><option>high</option><option>medium</option><option>low</option></select></label>
          <label class="micro">Age band<select name="age"><option value="">Any age</option><option>new</option><option>young</option><option>seasoned</option><option>veteran</option></select></label>
        </div>
        <fieldset><legend>TVL band</legend><div class="ranges">
          <label><span>Min</span><output id="minValue"></output><input type="range" name="min" min="-1" max="4" value="-1"></label>
          <label><span>Max</span><output id="maxValue"></output><input type="range" name="max" min="0" max="5" value="5"></label>
        </div></fieldset>
      </form>
    </aside>
    <main class="main">
      <div class="board-head">
        <div><div class="micro eyebrow">Launch watchlist</div><h1>Opportunity board</h1><p>Protocols whose snapshot records no token, ranked by modeled value.</p></div>
        <button type="button" class="quiet model-button" id="methodButton">Scoring model <span aria-hidden="true">↗</span></button>
      </div>
      <section class="board" aria-label="Ranked opportunities">
        <div class="board-status"><span id="count" role="status"></span><div id="chips" class="chips"></div><span class="board-hint">↑ ↓ navigate · Enter inspect</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th scope="col"><button data-sort="rank">Rank <span></span></button></th><th scope="col">Protocol</th>
              <th scope="col"><button data-sort="tvl_usd">TVL <span></span></button></th><th scope="col"><button data-sort="growth">7d TVL <span></span></button></th>
              <th scope="col"><button data-sort="age_days">Age <span></span></button></th><th scope="col">Confidence</th>
              <th scope="col"><button data-sort="implied_value_usd">Implied value <span></span></button></th><th scope="col">Farm fees</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
    <div class="drawer-top"><span class="micro" id="drawerLabel">Protocol detail</span><button type="button" class="quiet" id="close" aria-label="Close detail">Close <span aria-hidden="true">×</span></button></div>
    <div id="detail"></div>
  </dialog>
</body>
</html>
